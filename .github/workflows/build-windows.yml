name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test (generate drawings)
        run: |
          python jeomhwajang_core.py
          python jeomhwajang_3d.py
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --icon assets/icon.ico --add-data "assets;assets" --name GakgungJeomhwajang jeomhwajang_gui.py
      - uses: actions/upload-artifact@v6
        with:
          name: GakgungJeomhwajang-windows
          path: dist/GakgungJeomhwajang.exe
      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/GakgungJeomhwajang.exe
