name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test (generate drawings)
        run: |
          python jeomhwajang_core.py
          python jeomhwajang_3d.py
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --icon assets/icon.ico --add-data "assets;assets" --name GakgungJeomhwajang jeomhwajang_gui.py
      - uses: actions/upload-artifact@v6
        with:
          name: GakgungJeomhwajang-windows
          path: dist/GakgungJeomhwajang.exe
      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/GakgungJeomhwajang.exe

  build-win7:
    # Windows 7은 Python 3.9 이상을 실행할 수 없어 Python 3.8로 따로 빌드
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
          architecture: ${{ matrix.arch }}
      - name: Install
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -r requirements-win7.txt
      - name: Smoke test (generate drawings)
        run: |
          python jeomhwajang_core.py
          python jeomhwajang_3d.py
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --icon assets/icon.ico --add-data "assets;assets" --name GakgungJeomhwajang_win7_${{ matrix.arch }} jeomhwajang_gui.py
      - uses: actions/upload-artifact@v6
        with:
          name: GakgungJeomhwajang-win7-${{ matrix.arch }}
          path: dist/GakgungJeomhwajang_win7_${{ matrix.arch }}.exe
      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/GakgungJeomhwajang_win7_${{ matrix.arch }}.exe
